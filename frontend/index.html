<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokeMatch</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73;
    --border: #d2d2d7; --accent: #e3350d; --bar: #3b82f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111114; --card: #1c1c21; --text: #f2f2f5; --muted: #9a9aa3; --border: #34343c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  h1 { margin: 0 0 4px; color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 999px;
          padding: 5px 12px; cursor: pointer; font: inherit; font-size: 14px; text-transform: capitalize; }
  .chip.on { color: #fff; border-color: transparent; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px 24px; }
  .stat { display: grid; grid-template-columns: 120px 1fr 28px; align-items: center; gap: 8px; font-size: 14px; }
  .stat input { width: 100%; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  input[type=number] { width: 80px; padding: 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  #go { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 22px; font: inherit; font-weight: 600; cursor: pointer; }
  #go:disabled { opacity: .5; cursor: wait; }
  #status { color: var(--muted); font-size: 14px; }
  #error { color: var(--accent); white-space: pre-wrap; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 14px; }
  td img { width: 48px; height: 48px; image-rendering: pixelated; display: block; }
  .name { text-transform: capitalize; font-weight: 600; }
  .type { display: inline-block; color: #fff; border-radius: 4px; padding: 1px 6px; margin-right: 4px; font-size: 12px; text-transform: capitalize; }
  .bar { background: var(--border); border-radius: 4px; height: 8px; width: 100%; min-width: 80px; }
  .bar > div { background: var(--bar); height: 100%; border-radius: 4px; }
  pre { background: var(--bg); padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>PokeMatch</h1>
  <p class="sub">Findet das beste Pokémon für dein Team. <span id="impl"></span></p>

  <div class="card">
    <h2>Generationen</h2>
    <div class="chips" id="gens"></div>
  </div>

  <div class="card">
    <h2>Gewünschte Typen</h2>
    <div class="chips" id="types"></div>
  </div>

  <div class="card">
    <h2>Stat-Gewichtung</h2>
    <div class="stats" id="stats"></div>
  </div>

  <div class="card row">
    <label>Typ-Bonus <input type="number" id="bonus" value="50" min="0"></label>
    <label>Anzahl <input type="number" id="limit" value="10" min="1" max="100"></label>
    <button id="go">Finden</button>
    <span id="status"></span>
  </div>

  <div class="card" id="out" hidden>
    <div id="error"></div>
    <table id="table" hidden>
      <thead><tr><th>#</th><th></th><th>Name</th><th>Gen</th><th>Typen</th><th>Score</th><th style="width:30%"></th></tr></thead>
      <tbody></tbody>
    </table>
    <details id="raw" hidden><summary>JSON</summary><pre></pre></details>
  </div>
</main>

<script>
const TYPE_COLORS = {
  normal:"#9fa19f", fire:"#e62829", water:"#2980ef", electric:"#d4a800", grass:"#3fa129", ice:"#3dc7ef",
  fighting:"#ff8000", poison:"#9141cb", ground:"#915121", flying:"#81b9ef", psychic:"#ef4179", bug:"#91a119",
  rock:"#afa981", ghost:"#704170", dragon:"#5060e1", dark:"#624d4e", steel:"#60a1b8", fairy:"#ef70ef",
};
const STAT_LABELS = { hp:"HP", attack:"Attack", defense:"Defense", special_attack:"Sp. Attack", special_defense:"Sp. Defense", speed:"Speed" };
const $ = s => document.querySelector(s);

function chip(label, value, color) {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = label; b.dataset.value = value;
  b.onclick = () => {
    b.classList.toggle("on");
    b.style.background = b.classList.contains("on") ? (color || "var(--accent)") : "";
  };
  return b;
}
const selected = id => [...document.querySelectorAll(`#${id} .chip.on`)].map(b => b.dataset.value);

async function init() {
  const meta = await fetch("/api/meta").then(r => r.json());
  $("#impl").textContent = `· Implementierung: ${meta.implementation} · ${meta.pokemon_loaded} Pokémon geladen`;
  meta.generations.forEach(g => $("#gens").append(chip(`Gen ${g}`, g)));
  meta.types.forEach(t => $("#types").append(chip(t, t, TYPE_COLORS[t])));
  meta.stats.forEach(s => {
    const row = document.createElement("label");
    row.className = "stat";
    row.innerHTML = `<span>${STAT_LABELS[s] || s}</span><input type="range" min="0" max="5" step="0.5" value="1" data-stat="${s}"><span>1</span>`;
    const [_, input, out] = row.children;
    input.oninput = () => out.textContent = input.value;
    $("#stats").append(row);
  });
}

async function search() {
  const body = {
    generations: selected("gens").map(Number),
    types: selected("types"),
    stat_weights: Object.fromEntries([...document.querySelectorAll("#stats input")].map(i => [i.dataset.stat, Number(i.value)])),
    type_bonus: Number($("#bonus").value),
    limit: Number($("#limit").value),
  };
  $("#go").disabled = true; $("#status").textContent = "Suche…";
  $("#out").hidden = false; $("#error").textContent = ""; $("#table").hidden = true; $("#raw").hidden = true;
  try {
    const res = await fetch("/api/match", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) {
      $("#error").textContent = `Fehler ${res.status}: ` + (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail, null, 2));
      return;
    }
    render(data);
    $("#status").textContent = `${data.details.length} Treffer (${data.implementation})`;
  } catch (e) {
    $("#error").textContent = String(e);
  } finally {
    $("#go").disabled = false;
    if ($("#status").textContent === "Suche…") $("#status").textContent = "";
  }
}

function render(data) {
  const tbody = $("#table tbody");
  tbody.innerHTML = "";
  data.details.forEach((p, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${i + 1}</td>
      <td>${p.sprite ? `<img src="${p.sprite}" alt="">` : ""}</td>
      <td class="name">${p.name}</td>
      <td>${p.generation}</td>
      <td>${p.types.map(t => `<span class="type" style="background:${TYPE_COLORS[t]}">${t}</span>`).join("")}</td>
      <td>${p.score}</td>
      <td><div class="bar"><div style="width:${Math.max(0, Math.min(100, p.score))}%"></div></div></td>`;
    tbody.append(tr);
  });
  $("#table").hidden = data.details.length === 0;
  if (data.details.length === 0) $("#error").textContent = "Keine Pokémon gefunden.";
  $("#raw").hidden = false;
  $("#raw pre").textContent = JSON.stringify(data.results);
}

$("#go").onclick = search;
init();
</script>
</body>
</html>
